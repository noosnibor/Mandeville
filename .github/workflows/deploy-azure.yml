name: Deploy to Azure (Production)

# Runs whenever the Production branch changes (and when "Promote Testing to Production" starts it).
# Publishes the web app in Release and pushes it to the Azure App Service.
#
# One-time setup in this repo (Settings > Secrets and variables > Actions):
#   Secret    AZURE_WEBAPP_PUBLISH_PROFILE  the full contents of the App Service's publish profile (.PublishSettings)
#   Variable  AZURE_WEBAPP_NAME             the App Service name, e.g. my-app

on:
  push:
    branches: [Production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish and deploy
    # Only ever deploy what is on Production, even if someone starts this by hand from another branch.
    if: github.ref == 'refs/heads/Production'
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Check out Production
        uses: actions/checkout@v4
        with:
          ref: Production

      - name: Check the Azure settings exist
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          missing=0
          if [ -z "$APP_NAME" ]; then
            echo "::error::AZURE_WEBAPP_NAME is empty. Add it under Settings > Secrets and variables > Actions > Variables tab (or as an Environment variable on 'Production'), in THIS repository."
            missing=1
          fi
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE is empty. Add it under Settings > Secrets and variables > Actions > Secrets tab, in THIS repository."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Azure settings found (app name has ${#APP_NAME} characters, publish profile has ${#PUBLISH_PROFILE} characters)."

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Mandeville.Web/Mandeville.Web.csproj

      - name: Publish (Release)
        run: dotnet publish src/Mandeville.Web/Mandeville.Web.csproj --configuration Release --no-restore --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
